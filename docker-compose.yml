# OPTIONAL: PostgreSQL via Docker.
#
# The default, working local setup for this project uses SQLite (see README),
# because Docker may not be available on every machine. This file is provided
# for teams that prefer PostgreSQL. To use it you must also switch the Prisma
# datasource provider to "postgresql" and regenerate migrations.
#
#   docker compose up -d
#   # set DATABASE_URL in .env to:
#   # postgresql://taskflow:taskflow@localhost:5432/taskflow?schema=public
#
# Then edit prisma/schema.prisma: provider = "postgresql", delete the SQLite
# migrations folder and run `npx prisma migrate dev --name init`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    ports:
      - '5432:5432'
    volumes:
      - taskflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskflow -d taskflow']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taskflow-postgres-data:
